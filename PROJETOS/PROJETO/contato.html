<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provedor de Internet - Contato</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container">
            <img src="logo.png" alt="Logo do Provedor" class="logo">
            <nav>
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="planos.html">Planos</a></li>
                    <li><a href="quem-somos.html">Quem Somos</a></li>
                    <li><a href="central.html" target="_blank">Central do Cliente</a></li>
                    <li><a href="contato.html" class="active">Contato</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Contato -->
    <section id="contato">
        <div class="container">
            <h2>Entre em Contato</h2>
            <form action="mailto:contato@provedor.com" method="post" enctype="text/plain">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone">

                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" required></textarea>

                <button type="submit">Enviar</button>
            </form>
        </div>
    </section>

    <!-- Botões de WhatsApp -->
    <div class="whatsapp-buttons">
        <a href="https://wa.me/5511999999999" class="whatsapp-button" target="_blank">Fale conosco no WhatsApp</a>
    </div>
</body>
</html>
